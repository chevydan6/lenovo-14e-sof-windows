name: Build RT5682 headphone codec driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test-codec-transport.py
      - run: python3 tools/test-codec-init.py
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build with Windows Driver Kit
        shell: pwsh
        run: msbuild driver/codec/sofrt5682.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal
      - name: Verify generated INF independently
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools' -Recurse -Filter InfVerif.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -Last 1
          if (-not $tool) { throw 'x64 InfVerif.exe was not found in the WDK' }
          Write-Host "Using $($tool.FullName)"
          & $tool.FullName /w driver/codec/x64/Debug/sofrt5682.inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sofrt5682-development-package
          path: driver/codec/x64/Debug/sofrt5682/
          if-no-files-found: error
