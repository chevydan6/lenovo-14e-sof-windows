name: Build Lenovo 14e speaker effects
on:
  push:
    paths: ['apo/**', 'audio-dsp/**', '.github/workflows/build-lenovo14e-apo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r audio-dsp/tests/requirements.txt
      - run: cmake -S audio-dsp -B build/dsp -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/dsp
      - run: ctest --test-dir build/dsp --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S apo -B build/apo -A x64
      - run: cmake --build build/apo --config Release
      - shell: pwsh
        run: |
          & ./build/apo/Release/lenovo14e-apo-probe.exe ./build/apo/Release/lenovo14eapo.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = Join-Path $env:ProgramFiles 'Lenovo14eAudio/Installer'
          New-Item $stage -ItemType Directory -Force | Out-Null
          $identity = Join-Path $stage 'test-identity.txt'
          $runner = Join-Path $stage 'test-system-worker.ps1'
          Set-Content $runner "[Security.Principal.WindowsIdentity]::GetCurrent().User.Value | Set-Content '$identity'"
          & ./build/apo/Release/lenovo14e-apo-worker.exe --run $runner ('Lenovo14eTest-'+[Guid]::NewGuid().ToString('N'))
          if ($LASTEXITCODE) { throw 'Temporary SYSTEM installer service failed.' }
          if ((Get-Content $identity -Raw).Trim() -ne 'S-1-5-18') { throw 'Installer did not run as SYSTEM.' }
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path apo/install.ps1),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          Copy-Item apo/install.ps1 build/apo/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: lenovo14e-apo-development-preview
          path: |
            build/apo/Release/lenovo14eapo.dll
            build/apo/Release/lenovo14e-apo-probe.exe
            build/apo/Release/install.ps1
            build/apo/Release/lenovo14e-apo-worker.exe
