name: Build N100 ACX speaker prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test-audio-format.py
      - run: python3 tools/test-acx-ring.py
      - run: python3 tools/test-acx-packet-lifetime.py
      - run: python3 tools/test-amp-hold.py
      - run: python3 tools/test-speaker-check.py
      - run: python3 tools/test-right-preview.py
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build with Windows Driver Kit
        shell: pwsh
        run: msbuild driver/acx/sofplay.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /verbosity:minimal
      - name: Verify generated INF independently
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools' -Recurse -Filter InfVerif.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -Last 1
          if (-not $tool) { throw 'x64 InfVerif.exe was not found in the WDK' }
          & $tool.FullName /w driver/acx/x64/Debug/sofplay.inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sofplay-development-package
          path: driver/acx/x64/Debug/sofplay/
          if-no-files-found: error

  right-preview:
    strategy:
      matrix:
        include:
          - artifact: sofplay-right-preview-package
            property: RightPreview
          - artifact: sofplay-right-preview-long-package
            property: RightPreviewLong
          - artifact: sofplay-right-preview-30-package
            property: RightPreview30
          - artifact: sofplay-stereo-trial-package
            property: StereoTrial
          - artifact: sofplay-right-trial-package
            property: RightTrial
          - artifact: sofplay-right-trial-dry-package
            property: RightTrialDry
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build explicitly armed right-only preview
        shell: pwsh
        run: msbuild driver/acx/sofplay.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /p:${{ matrix.property }}=true /verbosity:minimal
      - name: Verify generated INF
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools' -Recurse -Filter InfVerif.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -Last 1
          if (-not $tool) { throw 'x64 InfVerif.exe was not found' }
          & $tool.FullName /w driver/acx/x64/Debug/sofplay.inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: driver/acx/x64/Debug/sofplay/
          if-no-files-found: error
